# Override de producción: añade Traefik como reverse-proxy con HTTPS
# (Let's Encrypt) y deja de exponer los puertos de api/frontend al host.
#
# Requiere en .env: DOMAIN (dominio real apuntando al servidor) y ACME_EMAIL.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# IMÁGENES: producción NO compila. Los tres servicios propios apuntan a las
# imágenes que el CI publica en GHCR al integrar en main. El compose base sigue
# teniendo `build:` para el desarrollo local, así que aquí solo se añade
# `image:` y el despliegue usa `pull` + `up --no-build` (ver scripts/deploy.sh):
# ese `--no-build` es lo que hace que, si falta la imagen, falle en vez de
# ponerse a compilar en un servidor de 4 GB.
#
# IMAGE_TAG por defecto es `main`, la etiqueta móvil. Para volver a una versión
# anterior, poner en .env el SHA del commit y redesplegar:
#   IMAGE_TAG=25c7eb537a7ebe8014eb80ba9f112ce3c74a25cd
#
# Rutas: https://DOMAIN/        -> frontend
#        https://DOMAIN/api/... -> api (Traefik quita el prefijo /api)

services:
  reverse-proxy:
    # v3.1 fijaba en codigo la version 1.24 de la API de Docker, que Docker
    # Engine 29+ ya no acepta (minima: 1.40): el proveedor fallaba en bucle,
    # Traefik no descubria ninguna ruta y por tanto nunca pedia certificado.
    # No se arregla con DOCKER_API_VERSION porque v3.1 ignora esa variable.
    image: traefik:v3.7
    restart: unless-stopped
    environment:
      # Redundante con v3.7 (ya negocia la version), pero deja el
      # comportamiento fijado y explicito.
      DOCKER_API_VERSION: "1.44"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Por defecto, la CA de producción. Para ensayar sin gastar cuota, pon en
      # .env ACME_CASERVER con la de staging (ver .env.example). Al cambiar de
      # una a otra hay que borrar el volumen letsencrypt: si no, Traefik
      # reutiliza el certificado que ya tiene guardado.
      - --certificatesresolvers.le.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    depends_on:
      - api
      - frontend

  ocr-service:
    # Imagen ya construida por el CI, no se compila aquí (ver nota arriba).
    image: ghcr.io/nonok32/supercomparateca-ocr-service:${IMAGE_TAG:-main}

  api:
    image: ghcr.io/nonok32/supercomparateca-api:${IMAGE_TAG:-main}
    # No exponer al host: el tráfico entra por Traefik.
    ports: []
    environment:
      CORS_ORIGINS: https://${DOMAIN}
      # Los enlaces de confirmación y recuperación tienen que apuntar al
      # dominio real, no al localhost del compose base.
      FRONTEND_URL: https://${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.middlewares=api-strip
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      - traefik.http.services.api.loadbalancer.server.port=8000
      # Router aparte para /api/auth, con limite de peticiones por IP: frena el
      # alta masiva de cuentas y la fuerza bruta contra el login, que es la
      # parte de la API accesible sin token. `priority` explicita para que gane
      # al router general de /api (que si no, por longitud de regla, podria
      # atender tambien estas rutas y saltarse el limite).
      #
      # El limite se aplica a la IP real del cliente porque el DNS apunta
      # directo al servidor. Si algun dia se activa el proxy de Cloudflare
      # (nube naranja), Traefik pasaria a ver las IPs de Cloudflare y habria
      # que configurar forwardedHeaders.trustedIPs, o el limite se aplicaria
      # por edge de CF en vez de por visitante.
      #
      # 10 por minuto con picos de 5: de sobra para una persona, muy corto para
      # un bot. Subirlo si algun dia hay muchos usuarios tras una misma IP
      # (redes moviles con CGNAT, oficinas).
      - traefik.http.routers.auth.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/auth`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=le
      - traefik.http.routers.auth.priority=100
      - traefik.http.routers.auth.middlewares=api-strip,auth-ratelimit
      - traefik.http.middlewares.auth-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.auth-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.auth-ratelimit.ratelimit.burst=5

  frontend:
    image: ghcr.io/nonok32/supercomparateca-frontend:${IMAGE_TAG:-main}
    ports: []
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.services.frontend.loadbalancer.server.port=8080

volumes:
  letsencrypt:
