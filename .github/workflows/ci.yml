name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ocr-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

      # Los tests montan el esquema con create_all desde models.py, así que
      # pasarian aunque a alguien se le olvidara la migracion; en produccion eso
      # es una tabla que nunca se altera. `alembic check` compara los modelos
      # contra el resultado de aplicar las migraciones y falla si divergen.
      - name: Migraciones al dia (alembic check)
        if: matrix.service == 'api'
        env:
          JWT_SECRET_KEY: ci-secret-solo-para-comprobar-migraciones
          DATABASE_URL: sqlite:///./ci-migraciones.db
        run: |
          alembic upgrade head
          alembic check

  acceptance:
    name: Aceptación (Behave)
    needs: lint-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Tests de aceptación (behave)
        run: behave

  build:
    name: Build imagen (${{ matrix.service }})
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necesario para publicar en GHCR con el GITHUB_TOKEN: no hace falta
      # crear ni guardar ningun secreto propio.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, ocr-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # GHCR exige el nombre del propietario en minusculas y el de GitHub no
      # tiene por que serlo (aqui es "NonoK32").
      - name: Propietario en minusculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Solo al integrar en main: en un pull request la imagen se construye
      # igual (valida el Dockerfile) pero no se publica.
      - name: Entrar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Dos etiquetas con papeles distintos: `main` se mueve y sirve para
          # "dame lo ultimo"; la del commit es inmutable y es a la que hay que
          # anclar un despliegue si se quiere poder volver atras.
          tags: |
            ghcr.io/${{ env.OWNER }}/supercomparateca-${{ matrix.service }}:main
            ghcr.io/${{ env.OWNER }}/supercomparateca-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
