name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ocr-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

      # Los tests montan el esquema con create_all desde models.py, así que
      # pasarian aunque a alguien se le olvidara la migracion; en produccion eso
      # es una tabla que nunca se altera. `alembic check` compara los modelos
      # contra el resultado de aplicar las migraciones y falla si divergen.
      - name: Migraciones al dia (alembic check)
        if: matrix.service == 'api'
        env:
          JWT_SECRET_KEY: ci-secret-solo-para-comprobar-migraciones
          DATABASE_URL: sqlite:///./ci-migraciones.db
        run: |
          alembic upgrade head
          alembic check

  acceptance:
    name: Aceptación (Behave)
    needs: lint-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Tests de aceptación (behave)
        run: behave

  build:
    name: Build imagen (${{ matrix.service }})
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ocr-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin push; el registry/deploy llegan con la EPIC 7)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: supercomparateca-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
