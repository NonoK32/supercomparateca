# Configuracion de nginx para el frontend estatico.
#
# Sustituye a la default.conf de la imagen (mismo puerto 8080 no privilegiado)
# solo para poder fijar el cacheado, que es la razon de que este fichero exista.
#
# EL PROBLEMA QUE RESUELVE: nginx envia ETag y Last-Modified pero, por defecto,
# ningun Cache-Control. Sin esa cabecera el navegador aplica caducidad
# heuristica (RFC 9111 §4.2.2): se queda el fichero un 10% del tiempo que lleva
# sin modificarse, SIN volver a preguntar. Con ficheros publicados semanas
# atras eso son dias, asi que un despliegue del frontend era invisible para
# cualquiera que ya hubiera entrado antes. Paso el 2026-08-06: se desplego el
# rediseno y seguia viendose el diseno anterior.
#
# La politica es `no-cache`, que NO significa "no guardes": significa "guardalo
# pero revalida siempre". La revalidacion responde 304 sin cuerpo, asi que
# cuesta unos cientos de bytes y garantiza que nadie se queda atras.
#
# Si algun dia hay un paso de build que ponga un hash en el nombre de los
# ficheros, esos si pueden pasar a `max-age=31536000, immutable`, y solo
# index.html se queda en `no-cache`.

server {
    listen       8080;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        # `always` para que la cabecera salga tambien en respuestas 304 y de
        # error, no solo en los 200.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
