[project]
name = "supercomparateca-ocr"
version = "0.1.0"
description = "Servicio de OCR de SuperComparateca (FastAPI + Tesseract)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pytesseract>=0.3.10",
    "pillow>=10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Fijada a proposito: ver la nota en services/api/pyproject.toml.
    "ruff==0.16.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# File() en el valor por defecto es el mecanismo de FastAPI para recibir un
# fichero subido, no el bug que B008 persigue. Ver la nota en services/api.
extend-immutable-calls = ["fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
