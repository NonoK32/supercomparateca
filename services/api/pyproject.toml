[project]
name = "supercomparateca-api"
version = "0.1.0"
description = "API REST de SuperComparateca (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    # [crypto] trae `cryptography`, necesaria para verificar en RS256 los ID
    # token que firma Google (los nuestros son HS256 y no la necesitarian).
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Version fijada a proposito: con un rango abierto, CI instala la ultima y
    # cada vez que ruff amplia sus reglas por defecto se rompe el build sin que
    # nadie haya tocado el codigo (paso con 0.16.1). Subirla debe ser un commit
    # deliberado.
    "ruff==0.16.1",
    "behave>=1.2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# B008 prohibe llamar funciones en los valores por defecto de los argumentos,
# pero en FastAPI ese ES el mecanismo de inyeccion de dependencias: Depends(),
# File() y Form() estan pensados para evaluarse ahi y no guardan estado entre
# peticiones. Se declaran inmutables en vez de silenciar la regla con noqa en
# los ~34 sitios donde aparece, para que B008 siga avisando de los casos que si
# son un error (un list() o un dict() por defecto, por ejemplo).
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# El secreto JWT debe fijarse en el entorno antes de importar la app.
"tests/conftest.py" = ["E402"]
"features/environment.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
