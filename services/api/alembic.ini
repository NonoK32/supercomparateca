# Configuración de Alembic.
#
# La URL de la base de datos NO se pone aquí: la lee env.py de app.config
# (variable de entorno DATABASE_URL), para que haya una sola fuente de verdad y
# no se cuelen credenciales en el repositorio.
#
# Uso (desde services/api/):
#   .venv/bin/alembic upgrade head            aplicar migraciones
#   .venv/bin/alembic revision --autogenerate -m "descripcion"
#   .venv/bin/alembic check                   ¿models.py y migraciones divergen?

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = %(here)s
path_separator = os
# Fecha al principio del nombre para que el orden de versions/ se lea de un vistazo.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
