# Orquestación local de SuperComparateca.
# Copia .env.example a .env antes de levantar: `cp .env.example .env`
# Uso: `docker compose up --build`
#
# El reverse-proxy (HTTPS/Let's Encrypt) se añade en la EPIC 7 (despliegue),
# donde ya hay dominio. El frontend llega en la EPIC 4bis.
#
# `restart: unless-stopped` en todos los servicios: sin esto el stack no vuelve
# solo tras un reinicio del servidor y la web se queda caída hasta lanzar el
# compose a mano. "unless-stopped" y no "always" para que un `docker compose
# stop` deliberado siga siendo respetado tras el reboot.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr-service:
    build: ./services/ocr-service
    restart: unless-stopped
    environment:
      OCR_LANG: ${OCR_LANG:-spa}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OCR_SERVICE_URL: http://ocr-service:8001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?define JWT_SECRET_KEY en .env (openssl rand -hex 32)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      UMBRAL_AUTO: ${UMBRAL_AUTO:-0.92}
      UMBRAL_SUGERENCIA: ${UMBRAL_SUGERENCIA:-0.70}
      # Anti-bot en el registro. Vacías en desarrollo: sin clave secreta no se
      # verifica nada y el registro funciona sin widget.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Correo transaccional. Vacío en desarrollo: los mensajes van al log del
      # servicio en vez de enviarse, así el flujo se puede probar sin cuenta.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-SuperComparateca <no-reply@example.com>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
      # Acceso con Google. Vacío = el botón no se pinta y solo se entra con
      # email y contraseña. No hay secreto de cliente: el id es público.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./services/frontend
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      - api

volumes:
  pgdata:
